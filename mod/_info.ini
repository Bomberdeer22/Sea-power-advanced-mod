[Language_en]
Name=Sea Power Advanced
Description=Adds manual hatch control to Sea Power. Right-click one of your ships, open Orders > Weapon hatches, and open or close individual silo cells, VLS hatches, box launcher covers and torpedo tube shutters without firing a weapon. Requires Anchor Chain. Enable this mod in the mod manager, then restart the game.

[Language_de]
Name=Sea Power Advanced
Description=Fügt manuelle Klappensteuerung hinzu. Rechtsklick auf ein eigenes Schiff, dann Befehle > Waffenklappen, um einzelne Startsilos, VLS-Klappen, Starterschienen und Torpedorohr-Verschlüsse zu öffnen oder zu schließen, ohne eine Waffe abzufeuern. Benötigt Anchor Chain. Mod im Mod-Manager aktivieren und das Spiel neu starten.

[Language_en]
Name=Sea Power Advanced
Description=Fourteen advanced features, in the game's own right-click menus: per-cell hatch control (open and close individual silo cells, VLS hatches and torpedo shutters without firing), radar blink, EMCON profiles, automatic defensive ECM that jams inbound missiles and puts the close ones in the sea, offensive ECM that works on unidentified contacts, salvo deconfliction, action stations and crew fatigue, threat-axis formations, helicopter search patterns, replenishment alongside and more. Requires BepInEx; Anchor Chain is optional. If your install uses a mod manager, enable it there, then restart the game.

[Language_de]
Name=Sea Power Advanced
Description=Vierzehn erweiterte Funktionen in den eigenen Rechtsklick-Menüs des Spiels: Klappensteuerung für jede Zelle (einzelne Startsilos, VLS-Klappen und Torpedorohr-Verschlüsse öffnen und schließen, ohne zu feuern), Radar-Blinken, EMCON-Profile, automatische Verteidigungs-ECM, die anfliegende Raketen stört und nahe ins Meer fliegt, offensive ECM auch gegen nicht identifizierte Kontakte, Salven-Entzerrung, Gefechtsstationen und Besatzungsermüdung, Bedrohungsachsen-Formationen, Hubschrauber-Suchmuster, Versorgung auf See und mehr. Benötigt BepInEx; Anchor Chain ist optional. Falls ein Mod-Manager verwendet wird, dort aktivieren und das Spiel neu starten.
